<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aktiescanner – Chart</title>
    <style>
      body { margin: 0; background: #0f1115; color: #f5f7fb; font-family: 'Inter', sans-serif; }
      .container { padding: 24px; max-width: 960px; margin: 0 auto; }
      .card { background: #161b22; border: 1px solid #20242e; border-radius: 12px; padding: 24px; }
      canvas { width: 100%; height: 320px; background: #0f1115; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1 id="title">Laddar…</h1>
        <p id="subtitle" style="color:#9ca3af"></p>
        <canvas id="chart"></canvas>
      </div>
    </div>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const market = params.get('m');
      const ticker = params.get('t');
      const title = document.getElementById('title');
      const subtitle = document.getElementById('subtitle');
      const chartCanvas = document.getElementById('chart');
      if (!market || !ticker) {
        title.textContent = 'Ingen ticker angavs';
      } else {
        title.textContent = `${ticker}`;
        subtitle.textContent = 'Visar senast hämtade stängningspriser och SMA20/SMA50/SMA200';
        const res = await fetch(`/api/data/${market}/${ticker}`);
        const data = await res.json();
        const prices = data.prices || [];
        if (prices.length === 0) {
          subtitle.textContent = 'Inga prisdata ännu. Kör backendens uppdatering så visas grafen här.';
        } else {
          const ctx = chartCanvas.getContext('2d');
          const closes = prices.map(p => p.c);
          const max = Math.max(...closes);
          const min = Math.min(...closes);
          const scale = chartCanvas.height / (max - min || 1);
          ctx.strokeStyle = '#3b82f6';
          ctx.lineWidth = 2;
          ctx.beginPath();
          closes.forEach((close, index) => {
            const x = (index / (closes.length - 1 || 1)) * chartCanvas.width;
            const y = chartCanvas.height - (close - min) * scale;
            if (index === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.stroke();
        }
      }
    </script>
  </body>
</html>
